name: Android – Play Store release

on:
  workflow_dispatch:
    inputs:
      track:
        description: Play Console track
        type: choice
        default: internal
        options:
          - internal
          - alpha
          - beta
          - production
      status:
        description: Release status (draft = upload only, roll out manually in Play Console)
        type: choice
        default: completed
        options:
          - completed
          - draft

concurrency:
  group: android-play-release
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build AAB and upload to Play
    # Manual runs are only allowed from the master branch
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      # yarn.lock is not committed, so Yarn must be allowed to create it on CI
      YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # setup-node v5 enables caching from package.json's packageManager field,
          # which needs yarn.lock (not committed in this repo)
          package-manager-cache: false

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Install JS dependencies
        run: yarn install

      - name: Write .env and gemius.properties
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          MAVEN_GEMIUS_USER: ${{ secrets.MAVEN_GEMIUS_USER }}
          MAVEN_GEMIUS_PASSWORD: ${{ secrets.MAVEN_GEMIUS_PASSWORD }}
        run: |
          printf '%s\n' "$ENV_FILE" > .env
          {
            echo "MAVEN_GEMIUS_USER=$MAVEN_GEMIUS_USER"
            echo "MAVEN_GEMIUS_PASSWORD=$MAVEN_GEMIUS_PASSWORD"
          } > android/gemius.properties

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"

      - name: Build release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload AAB as workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: lt.mediapark.lrt
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"
