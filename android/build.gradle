def gemiusProperties = new Properties()
def gemiusPropertiesFile = rootProject.file('gemius.properties')
if (gemiusPropertiesFile.exists()) {
    gemiusProperties.load(new FileInputStream(gemiusPropertiesFile))
}

buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 26
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.4.0"
        // 23.0.0+ is built with Kotlin 2.4, which the Kotlin 2.2 compiler can't read
        castFrameworkVersion = "22.3.1"
    }
    repositories {
        mavenCentral()
        google()
        gradlePluginPortal()
        maven {
             url 'https://plugins.gradle.org/m2/' 
        }
        maven { url 'https://developer.huawei.com/repo/' }
    }
    dependencies {
        classpath('com.android.tools.build:gradle')
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath 'com.google.gms:google-services:4.5.0'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.8'
    }
}

 allprojects {
    ext.mavenGemiusUser = gemiusProperties["MAVEN_GEMIUS_USER"]
    ext.mavenGemiusPassword = gemiusProperties["MAVEN_GEMIUS_PASSWORD"]

     repositories {    
         maven {
             credentials {
                 username gemiusProperties["MAVEN_GEMIUS_USER"] as String
                 password gemiusProperties["MAVEN_GEMIUS_PASSWORD"] as String
             }
             url 'https://mobilesdk.gemius.com/releases/'
         }
         maven { url 'https://developer.huawei.com/repo/' }
         maven { url 'https://jitpack.io' }
         google()
         mavenCentral()
     }
 }



apply plugin: "com.facebook.react.rootproject"
